[project]
name = "quantforge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not live'"
# Make `packages.*` and `research.*` importable without an editable install.
# Without this, tests pass locally (cwd happens to be on sys.path) and fail on CI
# with ModuleNotFoundError - which is exactly what happened.
pythonpath = ["."]
# --strict-markers is on, so every marker must be declared here.
markers = [
    "live: hits a real external API. Excluded from CI - no test may require network.",
]
# Live tests are excluded by default (see addopts). Run them deliberately:
#   .venv/bin/python -m pytest -m live

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]  # assert is the point of a test suite

[tool.ruff.lint.per-file-ignores]
# S105/S106: fixture strings that look like secrets.
# S603: subprocess calls in tests run repo-owned scripts with constant paths,
#       never user input; the interpreter is resolved via shutil.which.
"tests/*" = ["S105", "S106", "S603"]
